[package]
name = "mgroup3-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mimalloc"]
# Swap the global allocator to mimalloc (see lib.rs). Default-on because it is
# a measured win on this small-allocation workload (AcceptCondition composites,
# MilestonePath Rc, evolve's small Vecs) with no semantic change — output is
# byte-identical. Disable with `--no-default-features` to fall back to the
# system allocator, or to build with `jemalloc` instead.
mimalloc = ["dep:mimalloc"]
# Alternative allocator kept for A/B comparison. Mutually exclusive with
# `mimalloc` (only one #[global_allocator] may exist); enable via
# `--no-default-features --features jemalloc`.
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
prost = "0.14"
bytes = "1"
prost-types = "0.14"
unicode-general-category = "1"
flate2 = "1"
rustc-hash = "2.1.2"
# rkyv cache: zero-copy archive of ParserDataPlain, bypasses the ~420ms prost
# decode on warm loads. bytecheck on for validated `access`; see parser_cache.rs.
rkyv = "0.8"
# fast non-crypto hash for cache header (source-file + payload integrity).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# mmap the rkyv cache so warm loads skip the 309 MB fs::read + AlignedVec copy;
# the aligned header lets us access the archive in place. See parser_cache.rs.
memmap2 = "0.9"
# Global allocator (feature-gated, default on). secure mode is left OFF —
# hardened heap metadata costs ~a few % and buys nothing here. See lib.rs.
mimalloc = { version = "0.1", optional = true, default-features = false }
# Alternative allocator for A/B comparison (feature `jemalloc`, off by default).
tikv-jemallocator = { version = "0.6", optional = true }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
libloading = "0.8"
